<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block page_title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">

</head>
<body>
    <!-- Navigation shared by every page (above the container) -->
    <nav class="navbar navbar-expand-lg site-navbar" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Hello World</a>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/favorite-course?subject=BMGT&amp;course_number=407">Favorite Course</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('contact') }}">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- One container per page; child templates fill in the blocks -->
    <div class="container py-4">
        <h1>{% block page_head %}{% endblock %}</h1>

        {% block page_content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
